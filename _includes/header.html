<div class="overlay" id="overlay"></div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const images = document.querySelectorAll('img[src*="mmbiz.qpic.cn"]');
    images.forEach(img => {
      img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(img.src);
    });
    const navTrigger = document.getElementById('navTrigger');
    const menuIcon = document.getElementById('menuIcon');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    let isMenuOpen = false;
    function isMobile() { return window.innerWidth <= 768; }
    function toggleMenu() {
      if (!isMobile()) return;
      isMenuOpen = !isMenuOpen;
      if (isMenuOpen) {
        drawer.classList.add('active');
        menuIcon.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        drawer.classList.remove('active');
        menuIcon.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }
    }
    function closeMenu() {
      if (isMenuOpen) {
        isMenuOpen = false;
        drawer.classList.remove('active');
        menuIcon.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }
    }
    if (navTrigger) navTrigger.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      toggleMenu();
    });
    if (overlay) overlay.addEventListener('click', closeMenu);
    document.querySelectorAll('.page-link').forEach(link => {
      link.addEventListener('click', function() {
        if (isMobile()) setTimeout(closeMenu, 100);
      });
    });
    window.addEventListener('resize', function() {
      if (!isMobile() && isMenuOpen) closeMenu();
    });
    if (drawer) drawer.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isMenuOpen) closeMenu();
    });
  });
</script>
