{% comment %}
structured-data.html — Person + WebPage/Article, 首页不再默认成 BlogPosting
{% endcomment %}
{% assign schema_type = page.type | default: 'WebPage' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ schema_type }}",
  "headline": "{{ page.title | default: site.title | default: '小亚说' | escape }}",
  "name": "{{ page.title | default: site.title | default: '小亚说' | escape }}",
  "datePublished": "{% if page.date %}{{ page.date | date_to_xmlschema }}{% else %}{{ site.time | date_to_xmlschema }}{% endif %}"{% if page.modified_date %},
  "dateModified": "{{ page.modified_date | date_to_xmlschema }}"{% endif %}{% if page.image or site.image %},
  "image": "{{ page.image | default: site.image }}"{% endif %},
  "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author.name | default: '小亚说' | escape }}",
    "url": "{{ site.author.url }}"
  },
  "author": {
    "@type": "Person",
    "name": "{{ page.author.name | default: site.author.name | default: '小亚说' | escape }}",
    "url": "{{ page.author.url | default: site.author.url }}"{% assign sameas_links = page.author.sameAs | default: site.author.sameAs %}{% if sameas_links %},
    "sameAs": [
      {% for link in sameas_links %}
        "{{ link }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]{% endif %}
  },
  "description": "{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}"
}
</script>
